#
# This pipeline needs the following tasks from Tekton Catalog
#   - git-clone     (install: kubectl apply -f https://raw.githubusercontent.com/tektoncd/catalog/main/task/git-clone/0.9/git-clone.yaml)
#   - flake8        (install: kubectl apply -f https://raw.githubusercontent.com/tektoncd/catalog/main/task/flake8/0.1/flake8.yaml)
#   - buildah       (ClusterTask – already installed on OpenShift)
#   - openshift-client (ClusterTask – already installed on OpenShift)
#
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace

  params:
    - name: repo-url
    - name: branch
      default: main
    # ── NEW (Exercise 7) ── image name built and deployed by the pipeline
    - name: build-image

  tasks:

    # ── 1. INIT ────────────────────────────────────────────────────────────────
    # Wipes the shared workspace so every run starts from a clean slate.
    - name: init
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: cleanup

    # ── 2. CLONE ───────────────────────────────────────────────────────────────
    # Clones the Git repository into the shared workspace.
    - name: clone
      workspaces:
        - name: output
          workspace: pipeline-workspace
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      runAfter:
        - init

    # ── 3. LINT (Exercise 3) ───────────────────────────────────────────────────
    # Runs flake8 on the cloned source code.
    # lint and tests run in PARALLEL (both runAfter: clone) to save time.
    - name: lint
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: flake8
      params:
        - name: image
          value: "python:3.9-slim"
        - name: args
          value: ["--count", "--max-complexity=10", "--max-line-length=127", "--statistics"]
      runAfter:
        - clone

    # ── 4. TESTS (Exercise 5) ──────────────────────────────────────────────────
    # Runs nosetests using the custom `nose` task defined in tasks.yaml.
    # Runs in PARALLEL with lint (both depend only on clone).
    - name: tests
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: nose
      params:
        - name: database_uri
          value: "sqlite:///test.db"
        - name: args
          value: "-v --with-spec --spec-color"
      runAfter:
        - clone

    # ── 5. BUILD (Exercise 7) ──────────────────────────────────────────────────
    # Builds a container image with buildah and pushes it to the image registry.
    # Waits for BOTH lint and tests to succeed before running.
    - name: build
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: buildah
        kind: ClusterTask          # buildah is a ClusterTask on OpenShift
      params:
        - name: IMAGE
          value: "$(params.build-image)"
      runAfter:
        - tests
        - lint

    # ── 6. DEPLOY (Exercise 8) ─────────────────────────────────────────────────
    # Uses the OpenShift CLI to patch deploy/deployment.yaml with the real image
    # name and then applies all manifests in the deploy/ folder.
    # Requires deploy/deployment.yaml to contain the placeholder IMAGE_NAME_HERE.
    - name: deploy
      workspaces:
        - name: manifest-dir       # workspace name required by openshift-client
          workspace: pipeline-workspace
      taskRef:
        name: openshift-client
        kind: ClusterTask          # openshift-client is a ClusterTask on OpenShift
      params:
        - name: SCRIPT
          value: |
            echo "Updating manifest..."
            sed -i "s|IMAGE_NAME_HERE|$(params.build-image)|g" deploy/deployment.yaml
            cat deploy/deployment.yaml
            echo "Deploying to OpenShift..."
            oc apply -f deploy/
            oc get pods -l app=accounts
      runAfter:
        - build
